# Local PostgreSQL + pgvector for development and the DB test suite.
#
# This does NOT replace Supabase: there is no Supabase Storage here. The backend
# still needs SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY for uploads. Use this
# container as DATABASE_URL (dev) or TEST_DATABASE_URL (tests) only.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aitwin
      POSTGRES_PASSWORD: aitwin
      POSTGRES_DB: aitwin_dev
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitwin -d aitwin_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
