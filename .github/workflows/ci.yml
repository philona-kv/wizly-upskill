name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Ruff
        run: python -m ruff check backend evaluation
      - name: Pytest
        run: python -m pytest -q
      - name: Offline evaluation smoke
        run: python -m evaluation --dataset evaluation/datasets/core.jsonl --limit 5 --offline --output reports/ci-smoke
