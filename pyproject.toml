[project]
name = "ai-twin"
version = "0.1.0"
description = "AI Twin for Contextual Document Understanding and Personal Knowledge Retrieval"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "backend/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S"]
ignore = ["B008", "S101"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S105", "S106", "S311"]
"frontend/tests/**" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app", "services", "components", "evaluation"]

[tool.pytest.ini_options]
pythonpath = [".", "backend", "frontend"]
testpaths = ["backend/tests", "frontend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "db: requires a disposable PostgreSQL+pgvector test database (TEST_DATABASE_URL)",
    "integration: requires real external services (Supabase, OpenAI); never run by default",
    "eval_smoke: offline evaluation CLI smoke test",
]
addopts = "-ra -m 'not integration'"
filterwarnings = ["ignore::DeprecationWarning:pymupdf.*"]
